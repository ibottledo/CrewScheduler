<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근무표 생성기</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; background: #f8f9fa; }
    h2 { text-align: center; color: #1a365d; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    select, input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; margin-bottom: 10px; }
    button { background: #2b6cb0; color: white; font-weight: bold; border: none; font-size: 16px; margin-top: 10px; }
    button:active { background: #2c5282; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
    .day-btn { padding: 8px 2px; text-align: center; border: 1px solid #e2e8f0; background: white; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .day-btn.selected { background: #e53e3e; color: white; border-color: #c53030; font-weight: bold; }
    
    /* 토큰 인증이 완료되었을 때 PAT 입력 칸을 깔끔하게 숨기기 위한 스타일 */
    .hidden { display: none !important; }
    .status-badge { font-size: 12px; color: #2b6cb0; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h2>Scheduler</h2>

  <div class="card">
    <div id="tokenSection">
      <label>PAT (Personal Access Token)</label>
      <input type="password" id="token" placeholder="GitHub PAT 입력">
    </div>
    <div id="authStatus" class="status-badge hidden">🔒 링크 인증 완료 (토큰 자동 적용됨)</div>
    
    <div style="display: flex; gap: 10px;">
      <div style="flex:1;">
        <label>연도</label>
        <select id="year" onchange="renderCalendar()">
          <option value="2026">2026년</option>
          <option value="2027">2027년</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>월</label>
        <select id="month" onchange="renderCalendar()">
          <option value="1">1월</option>
          <option value="2">2월</option>
          <option value="3">3월</option>
          <option value="4">4월</option>
          <option value="5">5월</option>
          <option value="6">6월</option>
          <option value="7">7월</option> 
          <option value="8">8월</option>
          <option value="9">9월</option>
          <option value="10">10월</option>
          <option value="11">11월</option>
          <option value="12">12월</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <label>휴가자 선택 (크루 번호)</label>
    <select id="crewSelect" onchange="renderCalendar()">
      <option value="0">0번 크루</option>
      <option value="1">1번 크루</option>
      <option value="2">2번 크루</option>
      <option value="3">3번 크루</option>
      <option value="4">4번 크루</option>
      <option value="5">5번 크루</option>   
      <option value="6">6번 크루</option>
      <option value="7">7번 크루</option>
      <option value="8">8번 크루</option>
      <option value="9">9번 크루</option>  
    </select>

    <label>휴가 날짜 터치하여 선택</label>
    <div id="calendar" class="calendar-grid"></div>
  </div>

  <button onclick="sendRequest()">🚀 근무표 생성 요청하기</button>

  <script>
    let vacationsMap = {};

    // 1. 페이지 로드 시 URL 파라미터(?t=ghp_...)에서 토큰 자동 추출 및 저장 로직
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('t');

      // URL에 토큰이 전달되었으면 localStorage에 자동 저장
      if (tokenFromUrl) {
        localStorage.setItem('crew_scheduler_pat', tokenFromUrl.trim());
        // 주소창에서 ?t=... 파라미터를 제거하여 토큰 노출 방지
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const savedToken = localStorage.getItem('crew_scheduler_pat');
      const tokenInput = document.getElementById('token');

      if (savedToken) {
        tokenInput.value = savedToken;
        // 이미 저장된 토큰이 있으면 PAT 입력란을 숨기고 안내 문구 노출
        document.getElementById('tokenSection').classList.add('hidden');
        document.getElementById('authStatus').classList.remove('hidden');
      }

      renderCalendar();
    };

    // 2. 선택한 연도/월에 맞게 달력 일수(28/30/31일)를 자동으로 계산하여 그리기
    function renderCalendar() {
      const cal = document.getElementById('calendar');
      cal.innerHTML = '';
      const emp = document.getElementById('crewSelect').value;
      if (!vacationsMap[emp]) vacationsMap[emp] = [];

      const year = parseInt(document.getElementById('year').value);
      const month = parseInt(document.getElementById('month').value);
      
      // 해당 월의 마지막 날짜 계산 (예: 2월은 28/29일, 4월은 30일 등)
      const daysInMonth = new Date(year, month, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const btn = document.createElement('div');
        btn.className = 'day-btn' + (vacationsMap[emp].includes(day) ? ' selected' : '');
        btn.innerText = day + '일';
        btn.onclick = () => {
          if (vacationsMap[emp].includes(day)) {
            vacationsMap[emp] = vacationsMap[emp].filter(d => d !== day);
          } else {
            vacationsMap[emp].push(day);
          }
          renderCalendar();
        };
        cal.appendChild(btn);
      }
    }

    // 3. API 요청 보내기
    async function sendRequest() {
      let token = document.getElementById('token').value.trim() || localStorage.getItem('crew_scheduler_pat');
      
      if (!token) {
        return alert('❌ 접근 권한이 없습니다. 관리자에게 전달받은 전용 링크로 접속해주시거나 PAT를 입력해 주세요!');
      }

      // 사용자가 수동으로 입력한 경우에도 브라우저에 자동 저장
      localStorage.setItem('crew_scheduler_pat', token);

      // 백엔드로 보낼 데이터 정리
      let vacationList = [];
      for (let emp in vacationsMap) {
        vacationsMap[emp].forEach(day => {
          vacationList.push([parseInt(emp), day]);
        });
      }

      const payload = {
        event_type: 'generate_schedule',
        client_payload: {
          year: parseInt(document.getElementById('year').value),
          month: parseInt(document.getElementById('month').value),
          vacations: vacationList
        }
      };

      try {
        const res = await fetch('https://api.github.com/repos/ibottledo/CrewScheduler/dispatches', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('✅ Actions 연산이 시작되었습니다!\nActions 탭에서 결과를 확인하세요.');
        } else {
          const errorData = await res.json().catch(() => ({}));
          console.error('API Error:', res.status, errorData);
          
          if (res.status === 404) {
            alert(`❌ [404 에러] 저장소를 찾을 수 없습니다.\n1. 저장소 이름(CrewScheduler)이나 ID(ibottledo) 오타 확인\n2. Private 저장소인데 토큰에 repo 권한이 없는지 확인`);
          } else if (res.status === 401) {
            alert('❌ [401 에러] PAT 토큰이 올바르지 않거나 만료되었습니다.');
          } else if (res.status === 403) {
            alert('❌ [403 에러] 토큰에 repo 권한이 없습니다. GitHub에서 repo 권한을 체크한 Classic 토큰을 발급받아 주세요.');
          } else if (res.status === 422) {
            alert('❌ [422 에러] event_type 이름이 workflow와 일치하지 않습니다.');
          } else {
            alert(`❌ 요청 실패 (상태 코드: ${res.status})\n${errorData.message || ''}`);
          }
        }
      } catch (err) {
        alert('❌ 네트워크 오류가 발생했습니다.');
        console.error(err);
      }
    }
  </script>
</body>
</html>
