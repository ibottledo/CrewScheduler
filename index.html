<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근무표 생성기</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; background: #f8f9fa; }
    h2 { text-align: center; color: #1a365d; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
    select, input[type="text"], input[type="password"], button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; margin-bottom: 10px; }
    .number-input { width: 50px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    button { background: #2b6cb0; color: white; font-weight: bold; border: none; font-size: 16px; margin-top: 10px; }
    button:active { background: #2c5282; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
    .day-btn { padding: 8px 2px; text-align: center; border: 1px solid #e2e8f0; background: white; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .day-btn.selected { background: #e53e3e; color: white; border-color: #c53030; font-weight: bold; }
    
    .hidden { display: none !important; }
    .status-badge { font-size: 12px; color: #2b6cb0; font-weight: bold; margin-bottom: 8px; }
    .setting-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
    .divider { border-top: 1px solid #eee; margin: 15px 0; }
  </style>
</head>
<body>

  <h2>Scheduler</h2>

  <div class="card">
    <div id="tokenSection">
      <label>PAT (Personal Access Token)</label>
      <input type="password" id="token" placeholder="GitHub PAT 입력">
    </div>
    <div id="authStatus" class="status-badge hidden">🔒 링크 인증 완료 (토큰 자동 적용됨)</div>
    
    <div style="display: flex; gap: 10px;">
      <div style="flex:1;">
        <label>연도</label>
        <select id="year" onchange="initMonth()"><option value="2026">2026년</option><option value="2027">2027년</option></select>
      </div>
      <div style="flex:1;">
        <label>월</label>
        <select id="month" onchange="initMonth()">
          <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
          <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
          <option value="7">7월</option><option value="8" selected>8월</option><option value="9">9월</option>
          <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <label style="color: #2b6cb0; font-size: 16px;">설정할 인원 선택</label>
    <select id="crewSelect" onchange="loadCrewData()">
      <option value="0">0번 크루</option><option value="1">1번 크루</option>
      <option value="2">2번 크루</option><option value="3">3번 크루</option>
      <option value="4">4번 크루</option><option value="5">5번 크루</option>   
      <option value="6">6번 크루</option><option value="7">7번 크루</option>
      <option value="8">8번 크루</option><option value="9">9번 크루</option>  
    </select>

    <div class="divider"></div>

    <!-- 추가된 설정 UI: 기간 및 비율 -->
    <label>크루 기간 설정</label>
    <div class="setting-row">
      <input type="number" id="startDay" class="number-input" onchange="saveCrewData()"> 일 ~ 
      <input type="number" id="endDay" class="number-input" onchange="saveCrewData()"> 일
    </div>

    <label>선호 근무 비율 (D : E : N)</label>
    <div class="setting-row">
      D: <input type="number" id="ratioD" class="number-input" onchange="saveCrewData()">
      E: <input type="number" id="ratioE" class="number-input" onchange="saveCrewData()">
      N: <input type="number" id="ratioN" class="number-input" onchange="saveCrewData()">
    </div>

    <div class="divider"></div>

    <label>휴가 날짜 선택</label>
    <div id="calendar" class="calendar-grid"></div>
  </div>

  <button onclick="sendRequest()">근무표 생성</button>

  <script>
    // 상태 저장 변수들
    let vacationsMap = {};
    let durationsMap = {}; // 예: { "0": [1, 31], "1": [0, 0] } (0,0 은 off 의미)
    let ratiosMap = {};    // 예: { "0": {D: 2, E: 1, N: 2} }
    let daysInMonth = 31;

    // 1. 페이지 로드 시 토큰 처리
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('t');

      if (tokenFromUrl) {
        localStorage.setItem('crew_scheduler_pat', tokenFromUrl.trim());
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const savedToken = localStorage.getItem('crew_scheduler_pat');
      const tokenInput = document.getElementById('token');

      if (savedToken) {
        tokenInput.value = savedToken;
        document.getElementById('tokenSection').classList.add('hidden');
        document.getElementById('authStatus').classList.remove('hidden');
      }

      initMonth();
    };

    // 연/월 변경 시 일수 계산하고 초기화
    function initMonth() {
      const year = parseInt(document.getElementById('year').value);
      const month = parseInt(document.getElementById('month').value);
      daysInMonth = new Date(year, month, 0).getDate();
      
      // 크루 정보 초기화(기본값 채우기)
      for(let i = 0; i <= 9; i++) {
        if (!vacationsMap[i]) vacationsMap[i] = [];
        if (!durationsMap[i]) durationsMap[i] = [1, daysInMonth];
        if (!ratiosMap[i]) ratiosMap[i] = {D: 2, E: 1, N: 2};
      }
      loadCrewData();
    }

    // 선택된 크루의 데이터를 화면에 불러오기
    function loadCrewData() {
      const emp = document.getElementById('crewSelect').value;
      
      // 기간 세팅
      const duration = durationsMap[emp];
      if (duration[0] === 0) { // Off 상태
        document.getElementById('isOff').checked = true;
        document.getElementById('startDay').disabled = true;
        document.getElementById('endDay').disabled = true;
        document.getElementById('startDay').value = '';
        document.getElementById('endDay').value = '';
      } else {
        document.getElementById('isOff').checked = false;
        document.getElementById('startDay').disabled = false;
        document.getElementById('endDay').disabled = false;
        document.getElementById('startDay').value = duration[0];
        document.getElementById('endDay').value = duration[1];
      }

      // 비율 세팅
      const ratio = ratiosMap[emp];
      document.getElementById('ratioD').value = ratio.D;
      document.getElementById('ratioE').value = ratio.E;
      document.getElementById('ratioN').value = ratio.N;

      renderCalendar();
    }

    // 사용자가 입력 칸을 수정할 때 메모리에 저장
    function saveCrewData() {
      const emp = document.getElementById('crewSelect').value;
      const isOff = document.getElementById('isOff').checked;

      if (isOff) {
        durationsMap[emp] = [0, 0]; // 백엔드에 off로 전달할 약속 기호
      } else {
        let sd = parseInt(document.getElementById('startDay').value) || 1;
        let ed = parseInt(document.getElementById('endDay').value) || daysInMonth;
        durationsMap[emp] = [sd, ed];
      }

      ratiosMap[emp] = {
        D: parseInt(document.getElementById('ratioD').value) || 0,
        E: parseInt(document.getElementById('ratioE').value) || 0,
        N: parseInt(document.getElementById('ratioN').value) || 0
      };
    }

    // 투입 안함(Off) 체크박스 동작
    function toggleOff() {
      const isOff = document.getElementById('isOff').checked;
      document.getElementById('startDay').disabled = isOff;
      document.getElementById('endDay').disabled = isOff;
      saveCrewData();
    }

    // 달력 그리기
    function renderCalendar() {
      const cal = document.getElementById('calendar');
      cal.innerHTML = '';
      const emp = document.getElementById('crewSelect').value;

      for (let day = 1; day <= daysInMonth; day++) {
        const btn = document.createElement('div');
        btn.className = 'day-btn' + (vacationsMap[emp].includes(day) ? ' selected' : '');
        btn.innerText = day + '일';
        btn.onclick = () => {
          if (vacationsMap[emp].includes(day)) {
            vacationsMap[emp] = vacationsMap[emp].filter(d => d !== day);
          } else {
            vacationsMap[emp].push(day);
          }
          renderCalendar();
        };
        cal.appendChild(btn);
      }
    }

    // API 요청
    async function sendRequest() {
      let token = document.getElementById('token').value.trim() || localStorage.getItem('crew_scheduler_pat');
      if (!token) return alert('❌ PAT를 입력해 주세요!');

      localStorage.setItem('crew_scheduler_pat', token);

      // 1. 휴가 리스트 정제
      let vacationList = [];
      for (let emp in vacationsMap) {
        vacationsMap[emp].forEach(day => vacationList.push([parseInt(emp), day]));
      }

      // Payload(백엔드로 보낼 화물) 구성
      const payload = {
        event_type: 'generate_schedule',
        client_payload: {
          year: parseInt(document.getElementById('year').value),
          month: parseInt(document.getElementById('month').value),
          vacations: vacationList,
          durations: durationsMap,  // 새롭게 추가됨
          ratios: ratiosMap         // 새롭게 추가됨
        }
      };

      try {
        const res = await fetch('https://api.github.com/repos/ibottledo/CrewScheduler/dispatches', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('✅ Actions 연산이 시작되었습니다!\nActions 탭에서 결과를 확인하세요.');
        } else {
          alert(`❌ 요청 실패 (상태 코드: ${res.status})\n권한을 확인하세요.`);
        }
      } catch (err) {
        alert('❌ 네트워크 오류가 발생했습니다.');
      }
    }
  </script>
</body>
</html>
