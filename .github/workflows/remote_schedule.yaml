name: Remote Schedule Generator

on:
  repository_dispatch:
    types: [generate_schedule]

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv pip install --system ortools pandas

      - name: Run Scheduler
        run: main.py

      - name: Commit and push JSON result
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_result.json
          git commit -m "🚀 새로운 근무표 JSON 업데이트" || echo "변경사항 없음"
          git push